name: Deploy to Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no changes on server)"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ACTIONS_BLUEHOST }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to Bluehost
        run: |
          FLAGS="-az --delete --itemize-changes"
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          rsync $FLAGS \
            --exclude='/.git' --exclude='/.github' --exclude='/node_modules' --exclude='/tests' \
            --exclude='/.env' --exclude='/storage/' --exclude='/public/storage' \
            --exclude='/public/.htaccess' --exclude='/public/hot' --exclude='/database/*.sqlite' \
            --exclude='.well-known' --exclude='error_log' --exclude='cgi-bin' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/"

      - name: Migrate and refresh caches
        if: env.DRY_RUN != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && php artisan migrate --force && php artisan optimize:clear && php artisan optimize"
